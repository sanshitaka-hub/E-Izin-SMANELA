<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-smanela-transparent.png" />
    <title>E-Izin SMAN 1 Lawang - Surat Izin Keluar Sekolah Otomatis QR Code</title>

    <meta property="og:title" content="E-Izin SMAN 1 Lawang - Surat Izin Keluar Sekolah Otomatis QR Code" />
    <meta property="og:description" content="Sistem informasi pengelolaan surat izin keluar sekolah otomatis menggunakan QR Code di SMAN 1 Lawang dengan verifikasi Waka Kesiswaan dan notifikasi otomatis WhatsApp orang tua." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect ke DNS Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts dengan fallback font sistem -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    </noscript>

    <style>
      /* Base font fallback agar tampilan langsung muncul seketika tanpa jeda jaringan */
      html, body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes smanelaFastSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .smanela-instant-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      }
      .smanela-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(30, 58, 138, 0.4);
        border-top-color: #fbbf24;
        border-radius: 50%;
        animation: smanelaFastSpin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <!-- Ultra-lightweight instant preloader: Diganti seketika begitu React render -->
      <div id="smanela-loading-view" class="smanela-instant-loader">
        <div class="smanela-spinner"></div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: #ffffff;">SMA NEGERI 1 LAWANG</div>
        <div style="margin-top: 6px; padding: 3px 12px; background: rgba(30, 58, 138, 0.6); border: 1px solid rgba(251, 191, 36, 0.5); border-radius: 9999px; font-size: 10px; font-weight: 800; color: #fde047; letter-spacing: 0.12em;">BAKTIKU HARAPANMU</div>
        <p style="margin-top: 12px; font-size: 12px; color: #94a3b8; font-weight: 500;">Memuat Sistem E-Izin Siswa...</p>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
