<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-smanela-transparent.png" />
    <title>E-Izin SMAN 1 Lawang - Surat Izin Keluar Sekolah Otomatis QR Code</title>
    <meta name="description" content="Sistem informasi pengelolaan surat izin keluar sekolah otomatis menggunakan QR Code di SMAN 1 Lawang dengan verifikasi Waka Kesiswaan dan notifikasi otomatis WhatsApp orang tua." />
    <meta property="og:title" content="E-Izin SMAN 1 Lawang - Surat Izin Keluar Sekolah Otomatis QR Code" />
    <meta property="og:description" content="Sistem informasi pengelolaan surat izin keluar sekolah otomatis menggunakan QR Code di SMAN 1 Lawang dengan verifikasi Waka Kesiswaan dan notifikasi otomatis WhatsApp orang tua." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <!-- Fallback pre-mount visual -->
      <div id="smanela-loading-view" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: white; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e3a8a; border-top-color: #fbbf24; border-radius: 50%; animation: smanelaSpin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">SMA NEGERI 1 LAWANG</div>
        <div style="display: inline-block; margin-top: 6px; padding: 4px 14px; background: rgba(30, 58, 138, 0.7); border: 1px solid #fbbf24; border-radius: 9999px; font-size: 11px; font-weight: 800; color: #fde047; letter-spacing: 0.15em;">BAKTIKU HARAPANMU</div>
        <p id="smanela-loading-text" style="margin-top: 14px; font-size: 13px; color: #94a3b8; font-weight: 500;">Memuat Sistem E-Izin Keluar Siswa...</p>
        
        <div id="smanela-timeout-help" style="display: none; margin-top: 18px; max-width: 320px;">
          <p style="font-size: 12px; color: #fde047; margin-bottom: 12px; line-height: 1.4;">Memuat memakan waktu lebih lama dari biasanya. Klik tombol di bawah untuk membersihkan cache:</p>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();" style="padding: 9px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.4);">
            Buka Ulang & Bersihkan Cache
          </button>
        </div>
        <style>@keyframes smanelaSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <script>
      // Jika loading belum selesai dalam 2.5 detik (misal cache browser tersangkut), tampilkan tombol reset cache
      setTimeout(function() {
        var help = document.getElementById('smanela-timeout-help');
        if (help) help.style.display = 'block';
      }, 2500);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
